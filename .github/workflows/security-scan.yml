name: Security Scans

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    name: Dependency & Secret Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dependency / vuln scan (filesystem + manifests). Non-blocking initially to keep CI green.
      - name: Trivy - Vulnerability Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"

      # Secret scanning. Non-blocking initially to keep CI green.
      - name: Trivy - Secret Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: secret
          format: table
          exit-code: "0"
